# Hook set follows the dryvist terraform template (precommit/templates/terraform.yaml).
# Repo-local additions kept on top of it: mixed-line-ending, and pre-push hook install.
# tflint reads the org canonical config materialized at .tflint.hcl; markdownlint reads .markdownlint.yml.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/.*\.ya?ml$
        args:
          - --persona=regular
          - --min-severity=medium
          - --min-confidence=medium
          - --config
          - zizmor.yml

  # Terraform/OpenTofu static checks. Validate runs with -backend=false so it
  # needs no AWS credentials. tofu provides the binary via the .envrc devshell.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
