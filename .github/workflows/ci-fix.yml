# AI CI — thin caller for dryvist/ai-workflows suite-ci.
# On a PR-branch CI failure, routes to Claude auto-fix (cc-ci-fix); on a main
# failure, routes to an issue (ci-fail-issue). suite-ci gates on conclusion.
name: AI CI

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ci-suite:
    uses: dryvist/ai-workflows/.github/workflows/suite-ci.yml@main
    with:
      repo_context: "OpenTofu AWS module templates (foundation/, modules/iam, modules/storage, examples/complete)."
      ci_structure: "ci.yml runs per-directory tofu init/validate/test plus a 'Format and Lint' job: tofu fmt -check -recursive and tflint."
      workflow_name: "CI"
      extra_tools: "Bash(tofu:*)"
      daily_run_limit: "0"
    secrets: inherit
