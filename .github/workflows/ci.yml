# fmt/init/validate/tflint run in the org CI gate (`tofu_ci`, per directory);
# this keeps `tofu test`, which the gate does not run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.tofu"
      - "**.tfvars"
      - "**.tftest.hcl"
      - ".terraform.lock.hcl"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [foundation, modules/iam, modules/storage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - run: tofu init -backend=false
        working-directory: ${{ matrix.dir }}
      - run: tofu test -no-color
        working-directory: ${{ matrix.dir }}
